limitation: Fits only Gillo GQ, GT, G2 and Ghost risers, unlike the two universal 5/16-24 weights on this page, and the maker's ring claim covers the kit fitted to a compatible riser, not a complete bow with every other attachment.
suits: An archer who already owns a compatible Gillo riser and wants a kit designed and rated for it specifically, rather than a universal weight.
tradeoff: The Gillo G4 Hammers Weight Kit costs more than four times the Yost Mojo Weight for less added mass, in exchange for riser-specific fit and a published ring claim neither other product on this page offers.
