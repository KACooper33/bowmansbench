limitation: The published GPI does not fall in a straight line as spine number rises, so a buyer has to read the actual chart rather than assume a pattern.
suits: An archer who wants a full spine and weight chart published up front, without contacting the maker or a pro shop.
tradeoff: The Victory VAP Target Sport V6 costs a quarter of the Easton X10 and publishes every number a buyer needs to choose a spine without help.
