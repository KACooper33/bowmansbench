# Published figures are from Sportsman's Warehouse, 14 August 2026.
#
# Mass weight is the first measured value on this site, taken 14 August 2026.
# Weighed on a kitchen scale in ounces, unstrung, with the aftermarket Stonic
# arrow rest fitted and the cushion plunger removed.
#
#   unstrung  1 lb 12.16 oz  = 28.16 oz = 798.3 g
#   strung    1 lb 12.4 oz   = 28.4 oz  = 805.1 g
#
# The 6.8 g difference is the bowstring, which is a plausible weight for the
# Dacron string supplied. The unstrung figure is published because that is the
# convention makers use, and it is the one that compares against their numbers.
#
# PSE's own store does not list this bow. The product URL redirects to their
# homepage and their site search returns nothing for it, checked 14 August
# 2026. Retailers still stock it. That is reported on the page rather than
# called a discontinuation, which the evidence does not support.
