limitation: The published draw weight range tops out at 40 lb, so an archer who wants more will need a different limb.
suits: A beginner barebow archer, or anyone who wants to feel what a wood-core limb shoots like before paying for carbon.
tradeoff: The Galaxy Bronze Star ILF Recurve Limbs cost a third of the WNS Motive C5, and give up the speed and stiffness a carbon limb is built for.
