limitation: The WNS Quantum AX ships with no weights, and its published mounts sit on the back of the riser rather than below the grip.
suits: An archer who wants mounting points above and below the grip, which is what the 2022 World Archery bylaw permits.
tradeoff: The WNS Quantum AX 25" ILF Recurve Riser is the heaviest riser on this page as published, and it leaves the weight system to you.
