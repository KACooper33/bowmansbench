limitation: Magnesium construction makes the Galaxy Crescent the lightest riser here, which gives a barebow archer less mass to steady the bow.
suits: An archer on the smallest budget who wants an ILF riser that accepts a plunger and weights later.
tradeoff: The Galaxy Crescent 25" ILF Recurve Riser costs the least of any riser on this page, and supplies no weights at all.
