limitation: The Spigarelli Spiga Tab BB+ ships in one size only, so an archer whose hand does not suit a medium tab has no other size to choose from this maker.
suits: An archer who wants published stringwalking marks and does not need a choice of size, since the tab is ambidextrous and one size fits both hands the maker lists.
tradeoff: The Spigarelli Spiga Tab BB+ costs less than the Yost and publishes a feature the Yost listing does not state, at the cost of a single fixed size.
