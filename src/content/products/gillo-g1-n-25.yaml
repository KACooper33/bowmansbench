limitation: The Gillo G1-N is the successor to the original G1, so its own published specifications are the only ones that describe what a buyer receives today.
suits: A barebow archer who wants Gillo's weight and grip system without the higher mass weight of the GT.
tradeoff: The Gillo G1-N 25" ILF Barebow Recurve Riser is 20 dollars cheaper than the GT and 20 g lighter, and it is built specifically for barebow rather than shared with Olympic recurve.
