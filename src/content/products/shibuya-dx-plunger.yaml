limitation: Shibuya publishes neither the spring tensions nor the adjustment mechanism for the Shibuya DX Plunger, so a setting cannot be recorded by number from the maker's own figures.
suits: A first plunger, or any archer who sets tension once and leaves it alone.
tradeoff: The Shibuya DX Plunger gives most of the function for a fifth of the price of the Beiter Plunger, and gives up the ability to return to a numbered setting.
