limitation: The Gillo GT 25" ILF Recurve Riser is marketed for both recurve and barebow, so its weight mounting is not built for barebow alone the way the G1-N's is.
suits: An archer who wants one riser to cover both Olympic recurve and barebow, or who values the integrated shock absorbers.
tradeoff: The Gillo GT 25" ILF Recurve Riser costs 30 dollars more than the G1-N and weighs 20 g less, for a riser aimed at two divisions rather than one.
