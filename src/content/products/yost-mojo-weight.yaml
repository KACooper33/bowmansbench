limitation: Yost publishes no ring-pass claim for this weight, and a single 454 g weight is heavy enough that it may not clear the ring on some riser and limb combinations.
suits: An archer who wants one larger weight rather than stacking several smaller ones, on a riser with a standard 5/16-24 bushing.
tradeoff: The Yost Mojo Weight is the heaviest single weight on this page, which means it does more of the tuning work in one piece, and it is also the one most likely to need checking against the ring before an event.
