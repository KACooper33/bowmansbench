limitation: The listing states no draw weight range, no assembled length and no plunger bushing, and it ships a string silencer that is not legal in World Archery barebow.
suits: An archer who wants the cheapest route into ILF, where limbs come from the whole market rather than from one maker.
tradeoff: The Black Hunter ILF Recurve Bow is the only complete ILF bow on this site and costs less than the cheapest ILF riser and limb pair bought separately.
