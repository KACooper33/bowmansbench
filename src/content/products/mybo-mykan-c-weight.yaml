limitation: Mybo publishes no ring-pass claim for this weight on its own, and the 12.2 cm ring test applies to the complete bow, not to one weight in isolation.
suits: An archer who wants a single, inexpensive weight to start tuning balance with a standard 5/16-24 riser bushing.
tradeoff: The Mybo MYKAN C is the cheapest weight on this page and the lightest at 100 g, so it suits fine adjustment more than it suits carrying most of a barebow setup's added mass.
